    .view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.panel h2{font-size:16px;margin:0 0 16px}.dashboard{display:grid;grid-template-columns:1.08fr .92fr;gap:20px}.date-hero{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:4px}.date-number{font-size:86px;letter-spacing:-5px;line-height:.82;font-weight:850;color:var(--green)}.date-copy b{display:block;font-size:21px}.date-copy span{color:var(--muted);font-size:14px;margin-top:4px}.schedule-item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}.schedule-item:last-child{border-bottom:0}.schedule-time{font-size:12px;font-weight:800;color:var(--green)}.item-title{font-weight:700;font-size:14px}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.important{display:inline-flex;align-items:center;gap:4px;background:var(--red-soft);color:var(--red);font-size:10px;font-weight:800;border-radius:99px;padding:4px 7px;white-space:nowrap}.important:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red)}.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}.week-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.week-head h2{margin:0}.week-summary{color:var(--muted);font-size:12px}.week-summary b{color:var(--green);font-size:16px;margin-right:4px}.week-task-list{max-height:286px;overflow-y:auto;padding-right:7px;scrollbar-color:#bccbc4 transparent;scrollbar-width:thin}.week-task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line)}.week-task:last-child{border-bottom:0}.week-task-bullet{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:6px}.week-task.work .week-task-bullet{background:var(--blue)}.week-task.study .week-task-bullet{background:var(--study)}.week-task.done{opacity:.55}.week-task.done .item-title{text-decoration:line-through}.week-date{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}.calendar-panel{grid-column:1/-1}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:14px}.calendar-head h2{margin:0}.calendar-legend{display:flex;align-items:center;gap:13px;margin-left:auto;color:var(--muted);font-size:11px}.legend-item{display:flex;align-items:center;gap:5px}.legend-dot{width:8px;height:8px;border-radius:2px}.legend-dot.work{background:var(--blue)}.legend-dot.event{background:var(--red)}.legend-dot.study{background:var(--study)}.calendar-nav{display:flex;gap:6px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.cal-dow{font-size:10px;color:var(--muted);text-align:center;padding:8px 3px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cal-cell{min-height:122px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;overflow:hidden}.cal-cell.muted{background:#faf9f5;color:#bbb}.cal-num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:5px;font-weight:700}.cal-cell.today .cal-num{background:var(--green);color:#fff}.cal-entry{display:block;width:100%;border-left:3px solid var(--green);background:var(--green-soft);color:#2f5448;border-radius:3px;padding:3px 4px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}.cal-entry.work{border-color:var(--blue);background:var(--blue-soft);color:#285f90}.cal-entry.event{border-color:var(--red);background:var(--red-soft);color:#933a35}.cal-entry.study{border-color:var(--study);background:var(--study-soft);color:#5c6269}.cal-cell.muted .cal-entry{opacity:.45}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.project-list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.project-row{display:grid;grid-template-columns:44px minmax(180px,1fr) 100px 130px 110px auto;gap:14px;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line);cursor:pointer}.project-row:last-child{border-bottom:0}.project-row:hover{background:#faf9f5}.project-icon{width:40px;height:40px;border-radius:11px;background:var(--green-soft);display:grid;place-items:center;font-size:19px}.project-name{font-weight:800}.project-desc,.project-stat{font-size:11px;color:var(--muted);margin-top:4px}.category{font-size:11px;font-weight:700;color:var(--green)}.progress{height:6px;background:#ece9e1;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.row-actions,.item-actions{display:flex;gap:5px}.icon-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:5px 7px;cursor:pointer;font-size:11px}.icon-btn:hover{color:var(--ink);background:#f0eee7}.icon-btn.danger:hover{color:var(--red);background:var(--red-soft)}

    @media(max-width:950px){.app{grid-template-columns:74px 1fr}.brand{font-size:0;padding:0 6px 25px}.brand:before{content:'日';font-size:22px}.brand small,nav button span:not(.nav-icon),.side-bottom{display:none}aside{padding:24px 10px}nav button{justify-content:center}main{padding:25px 20px}.dashboard{grid-template-columns:1fr}.calendar-panel{grid-column:auto}.project-row{grid-template-columns:44px 1fr auto}.project-row>.category,.project-row>.project-progress,.project-row>.project-deadline{display:none}}

    .date-line.home-date{color:var(--ink);font-family:"I.Ming","Noto Serif TC","PMingLiU","Songti TC",serif;font-size:40px;font-weight:600;letter-spacing:.08em;margin-top:12px}.cal-entry:not(.work):not(.event):not(.study){color:#9b3300}

    /* 文青手帳主題：明體標題、紙張紋理、書脊式導覽 */
    body{background-color:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(116,72,55,.016) 0,rgba(116,72,55,.016) 1px,transparent 1px,transparent 28px)}

    .mobile-menu-toggle,.menu-backdrop{display:none}
    @media(max-width:620px){.topbar{align-items:flex-start}.topbar>div:first-child{padding-left:13px}.date-line.home-date{font-size:29px;letter-spacing:.04em}.panel{padding:18px}.panel h2{font-size:17px}}

<body>
<div class="app" id="appRoot">
  <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-controls="appSidebar" aria-expanded="false">☰ <span>目錄</span></button>
  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside id="appSidebar">
    <div class="brand">我的生活<small>LIFE MANAGER</small></div>
    <nav>
      <button data-view="today" class="active"><span>今日行程</span></button>
      <button data-view="projects"><span>專案管理</span></button>
      <button data-view="tasks"><span>所有任務</span></button>
      <button data-view="events"><span>所有約會</span></button>
    </nav>
    <div class="side-bottom"><button id="resetData">重設範例資料</button></div>
  </aside>
  <main>
    <header class="topbar">
      <div><div class="eyebrow">TIEN HSIN</div><h1 id="pageTitle" class="hidden"></h1><div class="date-line home-date" id="dateLine"></div></div>
      <div class="add-wrap"><button class="primary" id="addButton">＋ 新增行程</button><div class="add-menu" id="addMenu"><button data-add="project"><b>新增專案</b><small>建立生活、工作或學習專案</small></button><button data-add="event"><b>新增約會</b><small>記錄時間、地點與行程</small></button></div></div>
    </header>

    <section class="view active" id="view-today">
      <div class="dashboard">

data.projects=(data.projects||[]).map(p=>({...p,category:p.category||(p.area==='學習'?'學習':p.area==='工作'?'工作':p.area==='生活'?'生活':'預設'),icon:p.icon||'◇'}));

const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dateInRange=(date,start,end=start)=>!!start&&date>=start&&date<=(end||start);
const rangesOverlap=(start,end,rangeStart,rangeEnd)=>!!start&&start<=rangeEnd&&(end||start)>=rangeStart;
const fmtRange=(start,end)=>!start?'待安排':!end||end===start?fmt(start):`${fmt(start)} – ${fmt(end)}`;

function isThisWeek(start,end=start){if(!start)return false;const[a,b]=weekRange();return rangesOverlap(start,end,localDate(a),localDate(b))}

function normalizeData(next){
 next=next||clone(seed);
 next.projects=(next.projects||[]).map(p=>({...p,id:String(p.id),category:p.category||(p.area==='學習'?'學習':p.area==='工作'?'工作':p.area==='生活'?'生活':'預設'),status:p.status||'規劃中',start:p.start||'',deadline:p.deadline||'',desc:p.desc||'',icon:p.icon||categoryIcon(p.category)}));
 next.tasks=(next.tasks||[]).map(t=>({...t,id:String(t.id),project:String(t.project||''),date:t.date||'',endDate:t.endDate||t.date||'',important:t.important??t.priority==='高',done:!!t.done,completedAt:t.completedAt||''}));
 next.events=(next.events||[]).map(e=>({...e,id:String(e.id),category:e.category||'預設',date:e.date||'',endDate:e.endDate||e.date||'',time:(e.time||'').slice(0,5),location:e.location||'',done:!!e.done,completedAt:e.completedAt||''}));

}

function dbHeaders(extra={}){return {apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,...extra}}
async function dbRequest(table,query='',options={}){
 const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{...options,headers:dbHeaders(options.headers||{})});
 if(!res.ok){throw new Error(`${table} ${res.status}: ${await res.text()}`)}
 const text=await res.text();
 return text?JSON.parse(text):null;
}
function fromDbProject(p){return {id:String(p.id),name:p.name,category:p.category||'預設',status:p.status||'規劃中',start:p.start_date||'',deadline:p.deadline||'',desc:p.description||'',icon:p.icon||categoryIcon(p.category)}}
function fromDbTask(t){return {id:String(t.id),title:t.title,project:String(t.project_id||''),date:t.start_date||'',endDate:t.end_date||t.start_date||'',important:!!t.important,done:!!t.done,completedAt:t.completed_at||''}}
function fromDbEvent(e){return {id:String(e.id),title:e.title,category:e.category||'預設',date:e.start_date||'',endDate:e.end_date||e.start_date||'',time:(e.event_time||'').slice(0,5),location:e.location||'',done:!!e.done,completedAt:e.completed_at||''}}
function toDbProject(p){return {id:String(p.id),name:p.name||'',category:p.category||'預設',status:p.status||'規劃中',start_date:p.start||null,deadline:p.deadline||null,description:p.desc||'',icon:p.icon||categoryIcon(p.category)}}
function toDbTask(t){return {id:String(t.id),project_id:t.project||null,title:t.title||'',start_date:t.date||null,end_date:t.endDate||t.date||null,important:!!t.important,done:!!t.done,completed_at:t.completedAt||null}}
function toDbEvent(e){return {id:String(e.id),title:e.title||'',category:e.category||'預設',start_date:e.date,end_date:e.endDate||e.date,event_time:e.time||null,location:e.location||'',done:!!e.done,completed_at:e.completedAt||null}}
async function loadCloudData(){
 try{
  const [projects,tasks,events]=await Promise.all([
   dbRequest('life_projects','?select=*&order=created_at.asc'),
   dbRequest('life_tasks','?select=*&order=start_date.asc.nullslast,created_at.asc'),
   dbRequest('life_events','?select=*&order=start_date.asc,event_time.asc.nullslast')
  ]);
  data=normalizeData({projects:projects.map(fromDbProject),tasks:tasks.map(fromDbTask),events:events.map(fromDbEvent)});
  cloudReady=true;
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
 }catch(error){
  console.error(error);
  alert('讀取 Supabase 資料失敗，暫時使用本機資料。請確認 API key 與資料表權限。');
 }
}
function queueCloudSync(){syncQueue=syncQueue.then(syncCloudData).catch(error=>{console.error(error);alert('同步到 Supabase 失敗，請檢查網路或資料表權限。')})}
async function deleteAllRows(table){await dbRequest(table,'?id=neq.__never__',{method:'DELETE',headers:{Prefer:'return=minimal'}})}
async function insertRows(table,rows){if(!rows.length)return;await dbRequest(table,'?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function syncCloudData(){
 const snapshot=normalizeData(clone(data));
 await deleteAllRows('life_events');
 await deleteAllRows('life_tasks');
 await deleteAllRows('life_projects');
 await insertRows('life_projects',snapshot.projects.map(toDbProject));
 await insertRows('life_tasks',snapshot.tasks.map(toDbTask));
 await insertRows('life_events',snapshot.events.map(toDbEvent));
}

function taskScheduleHTML(t){const p=project(t.project);return `<div class="schedule-item today-entry linked-item ${t.done?'done':''}" data-edit-today-task="${t.id}" role="button" tabindex="0"><button class="check ${t.done?'done':''}" data-check="${t.id}" type="button" aria-label="${t.done?'標記為未完成':'標記為完成'}"></button><div class="schedule-time">任務</div><div><div class="item-title">${esc(t.title)}</div><div class="item-meta">${esc(p?.name||'未分類專案')} · ${esc(displayCategory(p?.category))}</div></div>${t.important?'<span class="important">重要</span>':'<span></span>'}</div>`}
function overdueTaskHTML(t){const p=project(t.project);return `<div class="week-task linked-item ${taskCategoryClass(t)}" data-open-task-project="${t.project}" role="link" tabindex="0"><button class="check" data-check="${t.id}" type="button" aria-label="標記為完成"></button><div><div class="item-title">${esc(t.title)}</div><div class="item-meta">任務 · ${esc(p?.name||'未分類專案')} · ${esc(displayCategory(p?.category))}</div></div><span class="week-date">${fmtWeekRange(t.date,t.endDate)}</span></div>`}
function overdueEventHTML(e){return `<div class="week-task linked-item ${eventCategoryClass(e)}" data-open-event="${e.id}" role="link" tabindex="0"><button class="check event-check" data-check-event="${e.id}" type="button" aria-label="標記為完成"></button><div><div class="item-title">${esc(e.title)}</div><div class="item-meta">約會 · ${esc(displayCategory(e.category))}${e.time?` · ${esc(e.time)}`:''}${e.location?` · ${esc(e.location)}`:''}</div></div><span class="week-date">${fmtWeekRange(e.date,e.endDate)}</span></div>`}

function isOverdueTask(t){const due=t.endDate||t.date;return !!due&&due<today()&&!t.done}

 const td=today();
 const events=data.events.filter(e=>dateInRange(td,e.date,e.endDate)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
 const todayTasks=data.tasks.filter(t=>dateInRange(td,t.date,t.endDate));

  ...data.tasks.filter(isOverdueTask).map(item=>({type:'task',item,due:item.endDate||item.date})),
  ...data.events.filter(isOverdueEvent).map(item=>({type:'event',item,due:item.endDate||item.date}))
 ].sort((a,b)=>a.due.localeCompare(b.due)||(a.type===b.type?0:a.type==='event'?-1:1));
 $('#weekTaskList').innerHTML=overdueItems.length?overdueItems.map(x=>x.type==='event'?overdueEventHTML(x.item):overdueTaskHTML(x.item)).join(''):'<div class="empty">目前沒有逾期未完成任務或約會。</div>';

}
function renderCalendar(){
 const y=calDate.getFullYear(),m=calDate.getMonth();
 $('#calendarTitle').textContent=`${y} 年 ${m+1} 月`;
 const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
 let html=['一','二','三','四','五','六','日'].map(x=>`<div class="cal-dow">週${x}</div>`).join('');
 for(let i=0;i<42;i++){
  let day=i-start+1,cm=m,muted='';
  if(day<1){day=prevDays+day;cm=m-1;muted='muted'}else if(day>days){day-=days;cm=m+1;muted='muted'}
  const ds=localDate(new Date(y,cm,day));
  const entries=[
   ...data.events.filter(e=>dateInRange(ds,e.date,e.endDate)).map(e=>({type:eventCategoryClass(e),title:`${e.title}${e.time?' '+e.time:''}`,mobileTitle:e.title.slice(0,4),eventId:e.id})),
   ...data.tasks.filter(t=>dateInRange(ds,t.date,t.endDate)&&!t.done).map(t=>({type:taskCategoryClass(t),title:t.title,mobileTitle:t.title.slice(0,4),projectId:t.project}))
  ];
  html+=`<div class="cal-cell ${muted} ${ds===today()?'today':''}" aria-label="${ds}"><div class="cal-num">${day}</div>${entries.map(e=>`<span class="cal-entry linked-item ${e.type}" ${e.eventId!==undefined?`data-open-event="${e.eventId}"`:`data-open-task-project="${e.projectId}"`} data-mobile-label="${esc(e.mobileTitle)}" role="link" tabindex="0" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}</div>`;
 }

}

function renderProjectDetail(){const el=$('#projectDetail'),p=project(selectedProject);if(!p){el.classList.remove('show');return}const ts=data.tasks.filter(t=>String(t.project)===String(p.id)).sort((a,b)=>(a.date||'9999-12-31').localeCompare(b.date||'9999-12-31')||a.title.localeCompare(b.title,'zh-Hant'));el.classList.add('show');el.innerHTML=`<div class="detail-head"><div><span class="category">${esc(displayCategory(p.category))} · ${esc(p.status)}</span><h2>${esc(p.name)}</h2><div class="item-meta">${esc(p.desc||'尚未填寫說明')}</div></div><div class="row-actions"><button class="ghost" data-add-task="${p.id}">＋ 新增任務</button><button class="ghost" data-close-detail>關閉</button></div></div>${ts.length?ts.map(taskHTML).join(''):'<div class="empty">這個專案還沒有任務。</div>'}`}
function renderTasks(){let ts=[...data.tasks];if(taskFilter==='open')ts=ts.filter(t=>!t.done);if(taskFilter==='today')ts=ts.filter(t=>dateInRange(today(),t.date,t.endDate));if(taskFilter==='unscheduled')ts=ts.filter(t=>!t.date);ts.sort((a,b)=>(a.done-b.done)||(b.important-a.important)||(a.date||'9999').localeCompare(b.date||'9999'));$('#allTasks').innerHTML=ts.length?ts.map(taskHTML).join(''):'<div class="empty">沒有符合條件的任務。</div>'}
function renderEvents(){let events=[...data.events];if(eventFilter==='open')events=events.filter(e=>!e.done);events.sort((a,b)=>(a.done-b.done)||(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));$('#allEvents').innerHTML=events.length?events.map(eventListHTML).join(''):'<div class="empty">沒有符合條件的約會。</div>'}
function render(){renderToday();renderProjects();renderTasks();renderEvents()}
function switchView(v){currentView=v;$$('.view').forEach(x=>x.classList.toggle('active',x.id===`view-${v}`));$$('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));const pageTitle=$('#pageTitle'),isToday=v==='today';pageTitle.textContent={today:'',projects:'專案管理',tasks:'所有任務',events:'所有約會'}[v];pageTitle.classList.toggle('hidden',isToday);$('#dateLine').classList.toggle('home-date',isToday);if(v==='projects')renderProjects();if(v==='tasks')renderTasks();if(v==='events')renderEvents()}

function openLinkedProject(id){if(!project(id))return;selectedProject=String(id);switchView('projects');requestAnimationFrame(()=>$('#projectDetail')?.scrollIntoView({behavior:'smooth',block:'start'}))}
function openLinkedEvent(id){if(!data.events.some(e=>String(e.id)===String(id)))return;selectedEvent=String(id);eventFilter='all';$$('#eventFilters .filter').forEach(x=>x.classList.toggle('active',x.dataset.eventFilter==='all'));switchView('events');requestAnimationFrame(()=>document.getElementById(`event-row-${id}`)?.scrollIntoView({behavior:'smooth',block:'center'}))}

function openModal(id){$(`#${id}`).classList.add('open')}
function closeModals(){$$('.modal-wrap').forEach(x=>x.classList.remove('open'));$$('form.modal').forEach(x=>x.reset())}
function openProjectForm(p=null){$('#projectForm').reset();$('#projectId').value=p?.id||'';$('#projectModalTitle').textContent=p?'編輯專案':'新增專案';$('#projectName').value=p?.name||'';$('#projectCategory').value=p?.category||'預設';$('#projectStatus').value=p?.status||'規劃中';$('#projectStart').value=p?.start||today();$('#projectDeadline').value=p?.deadline||'';$('#projectDesc').value=p?.desc||'';openModal('projectModal');$('#projectName').focus()}
function openEventForm(e=null){$('#eventForm').reset();$('#eventId').value=e?.id||'';$('#eventModalTitle').textContent=e?'編輯約會':'新增約會';$('#eventTitle').value=e?.title||'';$('#eventCategory').value=e?.category||'預設';$('#eventDate').value=e?.date||today();$('#eventEndDate').value=e?.endDate||e?.date||today();$('#eventDate').dataset.previous=$('#eventDate').value;$('#eventEndDate').min=$('#eventDate').value;$('#eventTime').value=e?.time||'';$('#eventLocation').value=e?.location||'';openModal('eventModal');$('#eventTitle').focus()}
function openTaskForm(t=null,projectId=''){const pid=t?.project||projectId;if(!project(pid)){alert('請先選擇或新增專案。');return}$('#taskForm').reset();$('#taskId').value=t?.id||'';$('#taskProject').value=pid;$('#taskModalTitle').textContent=t?'編輯專案任務':`新增任務 · ${project(pid).name}`;$('#taskTitle').value=t?.title||'';$('#taskDate').value=t?.date||'';$('#taskEndDate').value=t?.endDate||t?.date||'';$('#taskDate').dataset.previous=$('#taskDate').value;$('#taskEndDate').min=$('#taskDate').value;$('#taskImportant').checked=!!t?.important;openModal('taskModal');$('#taskTitle').focus()}

const appRoot=$('#appRoot'),mobileMenuToggle=$('#mobileMenuToggle'),menuBackdrop=$('#menuBackdrop');
function setMobileMenu(open){appRoot.classList.toggle('menu-open',open);document.body.classList.toggle('menu-open',open);mobileMenuToggle.setAttribute('aria-expanded',String(open));mobileMenuToggle.innerHTML=open?'× <span>關閉</span>':'☰ <span>目錄</span>';menuBackdrop.setAttribute('aria-hidden',String(!open));if(open)$('#appSidebar nav button.active')?.focus()}
mobileMenuToggle.onclick=()=>setMobileMenu(!appRoot.classList.contains('menu-open'));
menuBackdrop.onclick=()=>setMobileMenu(false);
window.addEventListener('resize',()=>{if(window.innerWidth>620)setMobileMenu(false)});
$$('nav button').forEach(b=>b.onclick=()=>{switchView(b.dataset.view);setMobileMenu(false)});
$('#addButton').onclick=e=>{e.stopPropagation();$('#addMenu').classList.toggle('open')};
$('#addMenu').onclick=e=>{const type=e.target.closest('[data-add]')?.dataset.add;if(!type)return;$('#addMenu').classList.remove('open');type==='project'?openProjectForm():openEventForm()};
document.querySelector('[data-direct-add="event"]').onclick=()=>openEventForm();
document.addEventListener('click',e=>{if(!e.target.closest('.add-wrap'))$('#addMenu').classList.remove('open')});
$$('[data-close]').forEach(b=>b.onclick=closeModals);
$$('.modal-wrap').forEach(m=>m.onclick=e=>{if(e.target===m)closeModals()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModals();$('#addMenu').classList.remove('open');setMobileMenu(false)}});
$('#prevMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()+1);renderCalendar()};$('#thisMonth').onclick=()=>{calDate=new Date();renderCalendar()};
function syncEndDate(startInput,endInput){const previous=startInput.dataset.previous||'',start=startInput.value;if(!start){endInput.value='';endInput.removeAttribute('min')}else{endInput.min=start;if(!endInput.value||endInput.value===previous||endInput.value<start)endInput.value=start}startInput.dataset.previous=start}
$('#eventDate').onchange=()=>syncEndDate($('#eventDate'),$('#eventEndDate'));
$('#taskDate').onchange=()=>syncEndDate($('#taskDate'),$('#taskEndDate'));
$('#taskFilters').onclick=e=>{const f=e.target.dataset.filter;if(!f)return;taskFilter=f;$$('#taskFilters .filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));renderTasks()};
$('#eventFilters').onclick=e=>{const f=e.target.dataset.eventFilter;if(!f)return;eventFilter=f;selectedEvent='';$$('#eventFilters .filter').forEach(x=>x.classList.toggle('active',x.dataset.eventFilter===f));renderEvents()};

document.addEventListener('click',e=>{const check=e.target.closest('[data-check-event]');if(!check)return;const event=data.events.find(x=>String(x.id)===check.dataset.checkEvent);if(event){event.done=!event.done;event.completedAt=event.done?new Date().toISOString():'';save();render()}});

document.addEventListener('click',e=>{if(e.target.closest('button'))return;const eventCard=e.target.closest('[data-edit-today-event]');if(eventCard){openEventForm(data.events.find(x=>String(x.id)===eventCard.dataset.editTodayEvent));return}const taskCard=e.target.closest('[data-edit-today-task]');if(taskCard)openTaskForm(data.tasks.find(x=>String(x.id)===taskCard.dataset.editTodayTask))});
document.addEventListener('keydown',e=>{if(!['Enter',' '].includes(e.key)||e.target.closest('button'))return;const eventCard=e.target.closest('[data-edit-today-event]'),taskCard=e.target.closest('[data-edit-today-task]');if(eventCard){e.preventDefault();openEventForm(data.events.find(x=>String(x.id)===eventCard.dataset.editTodayEvent))}else if(taskCard){e.preventDefault();openTaskForm(data.tasks.find(x=>String(x.id)===taskCard.dataset.editTodayTask))}});

document.addEventListener('click',e=>{const eventLink=e.target.closest('[data-open-event]');if(eventLink&&!e.target.closest('button')){openLinkedEvent(eventLink.dataset.openEvent);return}const taskLink=e.target.closest('[data-open-task-project]');if(taskLink&&!e.target.closest('button'))openLinkedProject(taskLink.dataset.openTaskProject)});
document.addEventListener('keydown',e=>{if(!['Enter',' '].includes(e.key)||e.target.closest('button'))return;const eventLink=e.target.closest('[data-open-event]'),taskLink=e.target.closest('[data-open-task-project]');if(eventLink){e.preventDefault();openLinkedEvent(eventLink.dataset.openEvent)}else if(taskLink){e.preventDefault();openLinkedProject(taskLink.dataset.openTaskProject)}});

$('#projectForm').onsubmit=e=>{e.preventDefault();const id=$('#projectId').value,item={name:$('#projectName').value.trim(),category:$('#projectCategory').value,status:$('#projectStatus').value,start:$('#projectStart').value,deadline:$('#projectDeadline').value,desc:$('#projectDesc').value.trim(),icon:categoryIcon($('#projectCategory').value)};if(id){Object.assign(project(id),item)}else{item.id=`p-${Date.now()}`;data.projects.push(item);selectedProject=item.id}save();closeModals();switchView('projects');render()};
$('#eventForm').onsubmit=e=>{e.preventDefault();const id=$('#eventId').value,date=$('#eventDate').value,item={title:$('#eventTitle').value.trim(),category:$('#eventCategory').value,date,endDate:$('#eventEndDate').value||date,time:$('#eventTime').value,location:$('#eventLocation').value.trim()};if(item.endDate<date){alert('截止日期不能早於起始日期。');return}if(id)Object.assign(data.events.find(x=>String(x.id)===id),item);else data.events.push({...item,id:Date.now(),done:false});save();closeModals();render()};
$('#taskForm').onsubmit=e=>{e.preventDefault();const id=$('#taskId').value,date=$('#taskDate').value,item={title:$('#taskTitle').value.trim(),project:$('#taskProject').value,date,endDate:date?($('#taskEndDate').value||date):'',important:$('#taskImportant').checked};if(item.endDate&&item.endDate<date){alert('截止日期不能早於起始日期。');return}if(id)Object.assign(data.tasks.find(x=>String(x.id)===id),item);else data.tasks.push({...item,id:Date.now(),done:false});save();closeModals();render()};

document.addEventListener('click',e=>{const open=e.target.closest('[data-open-project]');if(open&&!e.target.closest('button')){selectedProject=open.dataset.openProject;renderProjectDetail();$('#projectDetail').scrollIntoView({behavior:'smooth',block:'start'});return}const close=e.target.closest('[data-close-detail]');if(close){selectedProject='';renderProjectDetail();return}const add=e.target.closest('[data-add-task]');if(add){openTaskForm(null,add.dataset.addTask);return}const check=e.target.closest('[data-check]');if(check){const t=data.tasks.find(x=>String(x.id)===check.dataset.check);if(t){t.done=!t.done;t.completedAt=t.done?new Date().toISOString():'';save();render()}return}const ep=e.target.closest('[data-edit-project]');if(ep){openProjectForm(project(ep.dataset.editProject));return}const dp=e.target.closest('[data-delete-project]');if(dp){const p=project(dp.dataset.deleteProject),count=data.tasks.filter(t=>String(t.project)===String(p.id)).length;if(confirm(`刪除「${p.name}」及其 ${count} 個任務？`)){data.projects=data.projects.filter(x=>String(x.id)!==String(p.id));data.tasks=data.tasks.filter(t=>String(t.project)!==String(p.id));save();render()}return}const et=e.target.closest('[data-edit-task]');if(et){openTaskForm(data.tasks.find(x=>String(x.id)===et.dataset.editTask));return}const dt=e.target.closest('[data-delete-task]');if(dt&&confirm('確定刪除這個任務？')){data.tasks=data.tasks.filter(x=>String(x.id)!==dt.dataset.deleteTask);save();render();return}const ee=e.target.closest('[data-edit-event]');if(ee){openEventForm(data.events.find(x=>String(x.id)===ee.dataset.editEvent));return}const de=e.target.closest('[data-delete-event]');if(de&&confirm('確定刪除這個約會？')){data.events=data.events.filter(x=>String(x.id)!==de.dataset.deleteEvent);save();render()}});
$('#resetData').onclick=()=>{if(confirm('這會清空目前畫面上的專案、任務與約會，並同步到 Supabase。確定要清空嗎？')){data=clone(seed);selectedProject='';selectedEvent='';save();render()}};

const now=new Date(),weekText=['日','一','二','三','四','五','六'][now.getDay()];$('#dateLine').textContent=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${weekText}`;render();loadCloudData();
</script>
</body>
</html>
